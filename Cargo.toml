[package]
name = "crusher"
version = "0.12.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
bincode = "1"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", features = ["toml"], default-features = false }
giganto-client = { git = "https://github.com/aicers/giganto-client.git", rev = "7c0baab56f8226e9cd43e110e028c12330be3d6d" }
num_enum = "0.7"
num-traits = "0.2"
# Preserve Quinn's non-crypto defaults while selecting aws-lc-rs.
quinn = { version = "0.11", default-features = false, features = [
    "log",
    "platform-verifier",
    "runtime-tokio",
    "rustls-aws-lc-rs",
    "bloom",
] }
review-protocol = { git = "https://github.com/aicers/review-protocol.git", features = [
    "client",
], tag = "0.23.0" }
rustls = { version = "0.23.46", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
    "std",
] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
    "x509-parser",
] }
time = "0.3"
rstest = "0.26"
review-protocol = { git = "https://github.com/aicers/review-protocol.git", features = [
    "server",
], tag = "0.23.0" }
libc = "0.2"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
