name: Upload Crusher release binary

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag (X.Y.Z) whose Release receives the binary
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "tag name"
        required: true
        default: "0.0.0"

permissions: {}

env:
  TAG: ${{ inputs.tag || inputs.tag_name }}

jobs:
  build-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a plain X.Y.Z version tag, got %q\n' "$TAG" >&2
            exit 1
          fi
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', env.TAG) }}
          # The build runs dependency build scripts in a job with write access.
          persist-credentials: false
      - name: Update to the Latest Version of Rust
        run: rustup update
      - name: Build Binary
        run: cargo build --release
      - name: Upload the binary to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent; then
            echo "::error::Could not find the GitHub Release for tag $TAG."
            exit 1
          fi
          gh release upload "$TAG" target/release/crusher --repo "$GITHUB_REPOSITORY" --clobber
