name: CI

# TRIGGERS: `push` is scoped to `main`. Without a branch filter it also matches
# pushes to pull-request branches, which already match `pull_request`, so every
# job ran twice per commit, on two separate workflow runs. Naming `branches:`
# also stops tag pushes from matching. `pull_request` checks out the branch
# already merged into its base, so merge coverage is not what is being dropped
# here — the one thing lost is CI on a branch with no pull request open, and
# `workflow_dispatch` replaces it (`gh workflow run ci.yml --ref <branch>`).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || (github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Change Filter
    runs-on: ubuntu-latest
    # The filter only reads the checked-out history, so `contents: read` is
    # all it needs.
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs-only }}
    steps:
      # The full history, because the action diffs locally and does not
      # fetch: a pull request against its merge-base with the base branch,
      # a push to `main` against `github.event.before`, and a dispatched
      # branch against its merge-base with `main`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # `docs-paths` lists the inert files, on top of the action's built-in
      # list (`*.md`, `LICENSE`, `.agent-instructions.toml`,
      # `.markdownlint*`), the shared-instructions pin among them: it
      # changes no build or test, and the ungated drift step checks it.
      # `not-docs-paths` names every path a build or a test reads, and wins
      # over `docs-paths`, so a `.md` under `src/` is code.
      #
      # Docs-only requires every changed path to be on the documentation
      # list and none on `not-docs-paths`. A path on neither list counts as
      # code: a `.clippy.toml` edit next to a README edit runs `check` and
      # `test`. Anything the action cannot establish also lands on
      # docs-only=false.
      - id: scope
        uses: aicers/agent-instructions/change-scope@main
        with:
          docs-paths: |
            docs/**
            **/*.md
            mkdocs.yml
            .markdownlint*
            .agent-instructions.toml
          not-docs-paths: |
            src/**
            Cargo.toml
            Cargo.lock
            tests/**
            .github/workflows/**
            scripts/**
            .clippy.toml

  check:
    needs: changes
    # Fail closed. A bare `docs_only != 'true'` lets a *failing* `changes` job
    # skip its dependants, and GitHub counts a skipped required check as a
    # pass -- so a broken filter would wave an untested change through.
    # `!cancelled()` runs the job whenever the filter did not positively
    # report docs-only, a failed filter included.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt -- --check --config group_imports=StdExternalCrate
      - name: Clippy
        run: cargo clippy --tests -- -D warnings
      - name: Detect Cargo.lock changes
        run: git diff-index --quiet HEAD --

  # Ungated, deliberately. This used to be the last step of `check`, which is
  # gated on the path filter -- so a docs-only change skipped `check` and took
  # the Markdown lint down with it. The one change that most needs this lint
  # was the one change that did not get it.
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    # Read-only, as in the other consumers of aicers/agent-instructions.
    # Nothing here writes: the lint reads the checkout, and the drift check
    # reads the pin and the upstream release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        id: checkout
      # No `globs` input. The `globs` and `ignores` of the root
      # `.markdownlint-cli2.yaml` are the one place that decides which files
      # are linted, here and in a local bare `markdownlint-cli2` alike. The
      # action's default `*.{md,markdown}` is only added to them and changes
      # nothing.
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25

      # Fails when this repository's copy of the shared instruction blocks
      # stops matching the release `.agent-instructions.toml` pins --
      # because a generated region of AGENTS.md was edited here, or because
      # an update pull request was never merged.
      #
      # It belongs in THIS job and not in `check`, because it must not
      # inherit the docs-only gate. `changes` counts `**/*.md` as docs and
      # AGENTS.md is a `.md` file, so a pull request that edits only a
      # generated region -- an update pull request included -- is docs-only
      # by that reckoning, and a gated step would skip the check on
      # precisely the changes that cause drift. `markdown` is ungated for
      # the reason above it, and is already the job that concerns itself
      # with this class of file.
      #
      # `@main`: the scripts are mechanism and come from wherever this
      # reference points, while the blocks are content and come from the
      # pin. No `with:` block, because the release to compare against and
      # the blocks to compare are both read from that one file.
      #
      # Guarded rather than left to the default `success()`, which would
      # skip it whenever the lint above failed. The checks are independent --
      # a drifted block is drift whether or not some other Markdown file also
      # breaks a lint rule. `!cancelled()` rather than `always()`, because a
      # cancelled run should stop. The `checkout` clause keeps a failed
      # checkout from being reported as drift: the action fails outright when
      # it cannot read the pin file, and in an empty workspace that message
      # names the pin for a problem that is not the pin's.
      - name: Check shared instruction-block drift
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: aicers/agent-instructions/check-drift@main

  test:
    needs: changes
    # Fail closed. A bare `docs_only != 'true'` lets a *failing* `changes` job
    # skip its dependants, and GitHub counts a skipped required check as a
    # pass -- so a broken filter would wave an untested change through.
    # `!cancelled()` runs the job whenever the filter did not positively
    # report docs-only, a failed filter included.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  coverage:
    needs: changes
    # Fail closed. A bare `docs_only != 'true'` lets a *failing* `changes` job
    # skip its dependants, and GitHub counts a skipped required check as a
    # pass -- so a broken filter would wave an untested change through.
    # `!cancelled()` runs the job whenever the filter did not positively
    # report docs-only, a failed filter included.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/checkout@v5
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: true

  # `always()`, deliberately, and not `!cancelled()`: a cancelled run would
  # otherwise skip this job, and GitHub counts a skipped required check as a
  # pass. Running through cancellation lets the assertions below see the
  # cancelled results and report red. Required checks go on `CI Gate`, not
  # on the individual jobs: a matrix job skipped at the job level is never
  # expanded, so a docs-only run reports `test` rather than
  # `test (ubuntu-latest)`. `markdown` is among the needs although it is
  # not gated, so that the gate covers it too.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: [changes, markdown, check, test, coverage]
    if: ${{ always() }}
    steps:
      # A filter that errored is a defect, not a tolerable outcome. The gated
      # jobs did still run (their `if:` fails closed), but the breakage has to
      # be visible rather than absorbed.
      - name: Assert the change filter succeeded
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "Change Filter: ${{ needs.changes.result }}" >&2
          exit 1

      # `skipped` is a pass here, and only here: it is what a gated job
      # reports on a docs-only change. `cancelled` is not.
      - name: Assert every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          bad="$(printf '%s' "${RESULTS}" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | "  \(.key): \(.value.result)"')"
          if [ -n "${bad}" ]; then
            echo "Not green:" >&2
            echo "${bad}" >&2
            exit 1
          fi
